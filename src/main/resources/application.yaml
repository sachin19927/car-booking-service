spring:
  application:
    name: car-booking-service
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:35432/velocity-motors-carrental}
    username: ${DB_USERNAME:booking-service}
    password: ${DB_PASSWORD:sachin_hs_123}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:car-booking-service}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
      missing-topics-fatal: false

app:
  kafka:
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:car-booking-service}
      retry:
        max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
        initial-backoff: ${KAFKA_RETRY_INITIAL_BACKOFF:1s}
    bank-transfer-payment-events:
      topic: ${BANK_TRANSFER_PAYMENT_EVENTS_TOPIC:bank-transfer-payment-events}
      dlt-topic: ${BANK_TRANSFER_PAYMENT_EVENTS_DLT_TOPIC:bank-transfer-payment-events.DLT}
      partitions: ${BANK_TRANSFER_PAYMENT_EVENTS_PARTITIONS:3}
      replication-factor: ${BANK_TRANSFER_PAYMENT_EVENTS_REPLICATION_FACTOR:1}
  booking:
    cancellation:
      fixed-delay: ${BOOKING_CANCELLATION_FIXED_DELAY:60000}
      batch-size: ${BOOKING_CANCELLATION_BATCH_SIZE:500}
  pricing:
    daily-rate:
      compact: ${PRICE_COMPACT_PER_DAY:50.00}
      sedan: ${PRICE_SEDAN_PER_DAY:70.00}
      suv: ${PRICE_SUV_PER_DAY:90.00}
      luxury: ${PRICE_LUXURY_PER_DAY:120.00}

credit-card-payment:
  base-url: ${CREDIT_CARD_PAYMENT_BASE_URL:http://localhost:9090/credit-card-payment-api}
  timeout:
    connect: ${CREDIT_CARD_PAYMENT_CONNECT_TIMEOUT:2s}
    read: ${CREDIT_CARD_PAYMENT_READ_TIMEOUT:3s}

resilience4j:
  retry:
    instances:
      creditCardPayment:
        max-attempts: ${CREDIT_CARD_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${CREDIT_CARD_RETRY_WAIT:1s}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        retry-exceptions:
          - com.motors.velocity.carbookingservice.exception.TransientPaymentServiceException
          - org.springframework.web.client.ResourceAccessException

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
